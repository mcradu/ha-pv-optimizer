name: HA PV Optimizer
version: "0.2.4"
slug: pv_optimizer
description: Explainable PV battery-export optimization with an integrated Web UI
url: https://github.com/mcradu/ha-pv-optimizer
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: PV Optimizer
panel_admin: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/api/health
backup: hot
stage: experimental
options:
  poll_interval_seconds: 30
  battery_capacity_kwh: 20
  minimum_morning_soc: 45
  safety_margin_soc: 3
  hysteresis_soc: 5
  static_night_load_w: 800
  night_max_w: 1200
  night_min_w: 200
  morning_max_w: 700
  charge_optimizer_enabled: true
  charge_on_voltage: 249
  charge_off_voltage: 247
  charge_stabilization_seconds: 300
  charge_minimum_state_seconds: 300
  sunset_target_soc: 100
  pv_available_on_w: 300
  pv_available_off_w: 100
  forecast_safety_kwh: 0.5
  influxdb_enabled: true
  influxdb_url: http://a0d7b954-influxdb:8086
  influxdb_database: home_assistant
  influxdb_retention_policy: one_year
  influxdb_measurement: pv_optimizer_charge
  influxdb_username: ""
  influxdb_password: ""
  shadow_mode: true
  entities:
    battery_soc: sensor.ss_battery_soc
    pv_power: sensor.ss_pv_power
    battery_power: sensor.ss_battery_power
    grid_power: sensor.ss_grid_power
    grid_connected: binary_sensor.ss_grid_connected
    sun: sun.sun
    forecast_tomorrow: sensor.energy_production_tomorrow
    forecast_today_remaining: sensor.energy_production_today_remaining
    grid_voltage_l1: sensor.ss_grid_l1_voltage
    grid_voltage_l2: sensor.ss_grid_l2_voltage
    grid_voltage_l3: sensor.ss_grid_l3_voltage
    battery_temperature: sensor.ss_battery_temperature
schema:
  poll_interval_seconds: int(5,300)
  battery_capacity_kwh: float(1,200)
  minimum_morning_soc: float(5,95)
  safety_margin_soc: float(0,20)
  hysteresis_soc: float(1,20)
  static_night_load_w: int(0,10000)
  night_max_w: int(0,10000)
  night_min_w: int(0,5000)
  morning_max_w: int(0,5000)
  charge_optimizer_enabled: bool
  charge_on_voltage: float(230,260)
  charge_off_voltage: float(230,260)
  charge_stabilization_seconds: int(0,1800)
  charge_minimum_state_seconds: int(0,3600)
  sunset_target_soc: float(50,100)
  pv_available_on_w: int(0,5000)
  pv_available_off_w: int(0,5000)
  forecast_safety_kwh: float(0,20)
  influxdb_enabled: bool
  influxdb_url: str
  influxdb_database: str
  influxdb_retention_policy: str
  influxdb_measurement: str
  influxdb_username: str
  influxdb_password: password
  shadow_mode: bool
  entities:
    battery_soc: str
    pv_power: str
    battery_power: str
    grid_power: str
    grid_connected: str
    sun: str
    forecast_tomorrow: str
    forecast_today_remaining: str
    grid_voltage_l1: str
    grid_voltage_l2: str
    grid_voltage_l3: str
    battery_temperature: str
