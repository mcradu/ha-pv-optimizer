name: Validate targeted probe rollback

on:
  push:
    branches:
      - fix/reteleelectrice-return-targeted-probe

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -r reteleelectrice_collector/requirements.txt pyyaml
      - name: Run tests
        run: |
          cd reteleelectrice_collector
          python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile reteleelectrice_collector/app/*.py
      - name: Check served JavaScript syntax
        run: |
          cd reteleelectrice_collector/app
          python - <<'PY'
          import re
          import run
          match = re.search(r"<script>(.*?)</script>", run.PAGE, re.S)
          assert match, "script block missing"
          open("/tmp/reteleelectrice-page.js", "w", encoding="utf-8").write(match.group(1))
          PY
          node --check /tmp/reteleelectrice-page.js
      - name: Parse config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data=yaml.safe_load(Path("reteleelectrice_collector/config.yaml").read_text())
          assert data["version"] == "0.3.2"
          PY
      - name: Build image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 -t local/reteleelectrice-collector:targeted-probe reteleelectrice_collector
      - name: Scope check
        run: |
          set -euo pipefail
          git diff --name-only 3ac42570551ad347bf920aed3a5bf289e99b3e9f...HEAD > /tmp/files
          cat /tmp/files
          test "$(wc -l < /tmp/files)" -eq 7
