name: Validate target token contexts

on:
  push:
    branches:
      - diagnostic/reteleelectrice-target-token-contexts

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -r reteleelectrice_collector/requirements.txt pyyaml
      - name: Run tests
        run: |
          cd reteleelectrice_collector
          python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile reteleelectrice_collector/app/*.py
      - name: Check served JavaScript syntax
        run: |
          cd reteleelectrice_collector/app
          python - <<'PY'
          import re
          import run
          match = re.search(r"<script>(.*?)</script>", run.PAGE, re.S)
          assert match, "script block missing"
          open("/tmp/reteleelectrice-page.js", "w", encoding="utf-8").write(match.group(1))
          PY
          node --check /tmp/reteleelectrice-page.js
      - name: Parse config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data=yaml.safe_load(Path("reteleelectrice_collector/config.yaml").read_text())
          assert data["version"] == "0.3.5"
          PY
      - name: Assert lightweight diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("reteleelectrice_collector/app/portal.py").read_text()
          assert "target_token_contexts" in text
          assert "static_code_contexts" not in text
          assert "TARGET_TOKEN_CONTEXT_LIMIT = 24" in text
          PY
      - name: Build image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 -t local/reteleelectrice-collector:target-token-contexts reteleelectrice_collector
      - name: Scope check
        run: |
          set -euo pipefail
          git diff --name-only 04b4838c21c3de8e708ec15f83d668769c4ab1c9...HEAD > /tmp/files
          cat /tmp/files
          test "$(wc -l < /tmp/files)" -eq 7
      - name: Secret scan
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=("BEGIN PRIVATE KEY","ghp_","github_pat_","AKIA")
          hits=[]
          for path in Path("reteleelectrice_collector").rglob("*"):
              if not path.is_file():
                  continue
              text=path.read_text(errors="ignore")
              for marker in bad:
                  if marker in text:
                      hits.append((str(path), marker))
          if hits:
              raise SystemExit(hits)
          PY
