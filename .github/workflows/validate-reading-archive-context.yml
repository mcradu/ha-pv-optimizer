name: Validate reading archive contexts

on:
  push:
    branches:
      - diagnostic/reteleelectrice-reading-archive-context

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r reteleelectrice_collector/requirements.txt pyyaml

      - name: Run tests
        run: |
          cd reteleelectrice_collector
          python -m unittest discover -s tests -v

      - name: Compile
        run: python -m py_compile reteleelectrice_collector/app/*.py

      - name: Parse config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("reteleelectrice_collector/config.yaml").read_text())
          assert data["version"] == "0.1.9"
          PY

      - name: Build image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 -t local/reteleelectrice-collector:context reteleelectrice_collector

      - name: Scope check
        run: |
          set -euo pipefail
          git diff --name-only a09a49199f6bc4b1386871f3ba5061d68f495278...HEAD > /tmp/files
          cat /tmp/files
          test "$(wc -l < /tmp/files)" -eq 6

      - name: Secret scan
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = ("BEGIN PRIVATE KEY", "ghp_", "github_pat_", "AKIA")
          hits = []
          for path in Path("reteleelectrice_collector").rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(errors="ignore")
              for marker in bad:
                  if marker in text:
                      hits.append((str(path), marker))
          if hits:
              raise SystemExit(hits)
          PY
