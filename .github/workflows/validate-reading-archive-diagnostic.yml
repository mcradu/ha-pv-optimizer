name: Validate reading archive diagnostic

on:
  push:
    branches:
      - diagnostic/reteleelectrice-reading-archive

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --quiet -r reteleelectrice_collector/requirements.txt pyyaml

      - name: Run collector tests
        run: |
          cd reteleelectrice_collector
          python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m py_compile reteleelectrice_collector/app/*.py

      - name: Parse add-on config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("reteleelectrice_collector/config.yaml").read_text())
          assert data["version"] == "0.1.6"
          assert data["ingress"] is True
          PY

      - name: Build collector image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.22 -t local/reteleelectrice-collector:diag reteleelectrice_collector

      - name: Scope check
        run: |
          set -euo pipefail
          git diff --name-only f370b1343fd0950b90a00e8d342f074fd14d2202...HEAD > /tmp/files
          cat /tmp/files
          grep -Fxq 'reteleelectrice_collector/app/portal.py' /tmp/files
          grep -Fxq 'reteleelectrice_collector/app/run.py' /tmp/files
          grep -Fxq 'reteleelectrice_collector/tests/test_collector.py' /tmp/files
          grep -Fxq 'reteleelectrice_collector/config.yaml' /tmp/files
          grep -Fxq 'reteleelectrice_collector/CHANGELOG.md' /tmp/files
          grep -Fxq 'reteleelectrice_collector/DOCS.md' /tmp/files
          grep -Fxq '.github/workflows/validate-reading-archive-diagnostic.yml' /tmp/files
          test "$(wc -l < /tmp/files)" -eq 7

      - name: Secret-pattern scan
        run: |
          set -euo pipefail
          if git grep -nEI --             '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}'             reteleelectrice_collector; then
            exit 1
          fi
